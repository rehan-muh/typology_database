name: Tang MATLAB audit temp
on:
  push:
    paths:
      - 'manual_phonetic_production/scripts/audit_tang_mat.py'
      - '.github/workflows/tang-mat-audit-temp.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas requests scipy h5py
      - run: python manual_phonetic_production/scripts/audit_tang_mat.py
      - uses: actions/upload-artifact@v4
        with:
          name: tang-mat-audit
          path: tang_mat_audit/
          retention-days: 3
